# .github/workflows/validate.yml
#
# Builds the Track-3 submission image and validates it end to end, on a GitHub-hosted Ubuntu
# runner. Docker is preinstalled, the runner is 4 vCPU / 16 GB which matches the Track-3 card
# contract, and the whole thing is scripted -- so no interactive shell is needed.
#
# Trigger it from the Actions tab ("Run workflow"), or on any push that touches engine/.
#
# NOTE ON TIMING: a GitHub-hosted runner is shared infrastructure, so the per-unit wall-clock
# numbers are noisier than a dedicated host would give. The GATE VERDICT is exact regardless --
# correctness does not depend on timing. Treat the timing table as indicative.

name: validate submission image

on:
  workflow_dispatch:
  push:
    paths:
      - 'engine/**'
      - '.github/workflows/validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (with LFS -- the reference traces are LFS objects)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Fetch LFS content
        run: git lfs pull

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install the scoring toolkit and the zig compiler
        run: |
          python -m pip install --upgrade pip
          python -m pip install ziglang
          python -m pip install "qfbench2-common[data] @ git+https://github.com/Agenthon-2026/Agenthon2026-public.git@v2.5.1#subdirectory=common"
          python -m pip install -e .
          python -c "import qfbench2_common, qfbench2_track_simulation, pyarrow, pandas; print('imports OK')"
          python -m ziglang version

      - name: Build the static submission binary
        working-directory: engine
        run: |
          # -ffp-contract=off is MANDATORY: without it the compiler fuses a multiply and add
          # into an FMA, which changes the last bit of the RNG arithmetic and breaks exact
          # trace reproduction. -w silences libc++'s own nullability warnings (119 of them).
          python -m ziglang c++ -std=c++20 -O2 -s -w -ffp-contract=off \
              -target x86_64-linux-musl -static \
              -o simulate_linux simulate.cpp kernel.cpp
          ls -la simulate_linux

      - name: Pre-flight (static, shell-free, linux/amd64)
        working-directory: engine
        run: python preflight.py simulate_linux

      - name: Native build + full correctness suite
        working-directory: engine
        run: |
          # Proves the engine itself on this platform before the container is involved:
          # 930/930 vs NumPy, 65/65 reference ledgers, 13/13 oracle, 604/604 + 664/664 on
          # t3-s001. This is also the first time these run against musl/glibc libm on Linux
          # rather than the Windows libm the fixtures were generated with.
          PY=python bash build.sh

      - name: Run every unit through the CLI natively, then grade
        working-directory: engine
        run: |
          python -m ziglang c++ -std=c++20 -O2 -w -ffp-contract=off \
              -o simulate simulate.cpp kernel.cpp
          OUT="$PWD/native_outputs"; rm -rf "$OUT"; mkdir -p "$OUT"
          for u in ../units/*/; do
            slug=$(basename "$u")
            if [ -f "$u/scenario.json" ]; then
              ./simulate simulate --config "$u/scenario.json" \
                  --out "$OUT/$slug/trace.parquet" >/dev/null
            else
              ./simulate simulate-batch --batch-dir "$u/scenarios" \
                  --out-dir "$OUT/$slug" >/dev/null
            fi
          done
          cd .. && python check_candidate.py --candidate engine/native_outputs | tail -6

      - name: Build and validate the Docker image end to end
        working-directory: engine
        env:
          CPUS: '4'
          MEM: '12g'   # runner has 16 GB total; leave headroom for the daemon
        run: bash validate_image.sh

      - name: Upload outputs for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-outputs
          path: |
            engine/image_outputs/**/events.json
            engine/image_outputs/**/batch_events.json
          retention-days: 7
          if-no-files-found: warn
